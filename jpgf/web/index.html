<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日本好物追蹤</title>
<style>
:root {
  color-scheme: light;
  --gutter: 16px;
  --bg: #ffffff;
  --surface-1: #ffffff;
  --surface-2: #f4f4f4;
  --thumb-bg: #f3f3f3;
  --blend: multiply;
  --border: #e6e6e6;
  --border-soft: rgba(0,0,0,.05);
  --text-primary: #000000;
  --text-secondary: #4a4a4a;
  --text-muted: #767676;
  --accent: #000000;
  --on-accent: #ffffff;
  --grid: #ececec;
  --sale: #d8001e;
  --tabbar-bg: rgba(255,255,255,.82);
  --tab-active: #e6e6e6;
  --pill-shadow: 0 2px 14px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000;
    --surface-1: #141414;
    --surface-2: #1f1f1f;
    --thumb-bg: #ffffff;
    --blend: normal;
    --border: #2b2b2b;
    --border-soft: rgba(255,255,255,.10);
    --text-primary: #ffffff;
    --text-secondary: #cfcfcf;
    --text-muted: #8f8f8f;
    --accent: #ffffff;
    --on-accent: #000000;
    --grid: #2b2b2b;
    --sale: #ff4d5e;
    --tabbar-bg: rgba(28,28,28,.78);
    --tab-active: rgba(255,255,255,.16);
    --pill-shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000;
  --surface-1: #141414;
  --surface-2: #1f1f1f;
  --thumb-bg: #ffffff;
  --blend: normal;
  --border: #2b2b2b;
  --border-soft: rgba(255,255,255,.10);
  --text-primary: #ffffff;
  --text-secondary: #cfcfcf;
  --text-muted: #8f8f8f;
  --accent: #ffffff;
  --on-accent: #000000;
  --grid: #2b2b2b;
  --sale: #ff4d5e;
  --tabbar-bg: rgba(28,28,28,.78);
  --tab-active: rgba(255,255,255,.16);
  --pill-shadow: none;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text-primary);
  font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }
.page { max-width: 1280px; margin: 0 auto; padding-bottom: 150px; }

/* ---------- 頂部：左右膠囊＋置中大 Logo ---------- */
.top {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) var(--gutter) 12px;
  max-width: 1280px; margin: 0 auto;
}
.top .r { justify-self: end; }
.logo {
  font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 900; font-size: clamp(30px, 8.6vw, 42px); letter-spacing: -.07em; line-height: 1;
  text-transform: uppercase; user-select: none;
}
.pill {
  font-weight: 600; font-size: 15px; background: var(--surface-1); border: 1px solid var(--border-soft);
  border-radius: 999px; height: 44px; padding: 0 20px; cursor: pointer; box-shadow: var(--pill-shadow);
  white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.pill.icon { width: 48px; height: 48px; padding: 0; }
.pill.icon svg { width: 22px; height: 22px; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pill:focus-visible, .tab:focus-visible, .act:focus-visible, .sq button:focus-visible, .arr:focus-visible {
  outline: 2px solid var(--text-primary); outline-offset: 2px;
}

/* ---------- 分類膠囊列 ---------- */
.cats, .sq {
  display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.cats::-webkit-scrollbar, .sq::-webkit-scrollbar, .hero-scroll::-webkit-scrollbar { display: none; }
.cats { padding: 6px var(--gutter) 18px; }
.cats .pill { flex: 0 0 auto; height: 48px; font-size: 16px; }

/* ---------- 公告列 ---------- */
.banner {
  margin: 0 var(--gutter) 16px; background: var(--surface-2); border-radius: 12px; min-height: 64px;
  display: flex; align-items: center; padding: 0 6px; color: var(--text-muted);
}
.btext { flex: 1; text-align: center; font-size: 14px; line-height: 1.35; padding: 8px 4px; transition: opacity .18s; }
.arr {
  border: 0; background: none; width: 40px; height: 40px; border-radius: 999px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--text-muted);
}
.arr svg { width: 20px; height: 20px; }

/* ---------- 大圖輪播 ---------- */
:root { --pad: max(var(--gutter), calc((100vw - 1280px) / 2 + var(--gutter))); }
.hero-scroll {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  padding: 0 var(--pad); scroll-padding: 0 var(--pad); -webkit-overflow-scrolling: touch;
}
.hero {
  flex: 0 0 min(86vw, 400px); aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; position: relative;
  scroll-snap-align: start; background: var(--thumb-bg); cursor: pointer; color: #fff; text-align: left;
  border: 0; padding: 0;
}
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.78) 0%, rgba(0,0,0,.42) 30%, rgba(0,0,0,0) 58%);
}
.hero .txt { position: absolute; left: 20px; right: 20px; bottom: 20px; z-index: 1; }
.hero h3 {
  margin: 0 0 12px; font-size: clamp(21px, 5.8vw, 27px); line-height: 1.22; font-weight: 600; letter-spacing: -.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hero .cta { font-size: 14px; font-weight: 600; opacity: .92; }
.hero .badge { z-index: 1; left: 16px; top: 16px; }
.prog { display: flex; gap: 8px; padding: 20px var(--pad) 0; }
.seg { flex: 1; height: 3px; border-radius: 2px; background: var(--grid); transition: background .2s; }
.seg.on { background: var(--text-primary); }

/* ---------- 標題與排序方塊 ---------- */
h2.sec { font-size: clamp(25px, 6.6vw, 32px); font-weight: 500; letter-spacing: -.015em; margin: 38px var(--gutter) 16px; line-height: 1.2; }
.sq { padding: 0 var(--gutter) 6px; }
.sq button {
  flex: 0 0 auto; font-size: 15px; font-weight: 500; background: var(--surface-2); color: var(--text-primary);
  border: 0; border-radius: 6px; padding: 16px 20px; cursor: pointer; white-space: nowrap;
}
.sq button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.searchbar { padding: 0 var(--gutter); margin-top: 4px; }
.searchbar input {
  width: 100%; height: 52px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--text-primary);
  font: inherit; font-size: 16px; padding: 0 24px; outline: none;
}
.searchbar input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.searchbar input:focus-visible { box-shadow: 0 0 0 2px var(--text-primary); }
.count { color: var(--text-muted); font-size: 13px; margin: 18px var(--gutter) 14px; }

/* ---------- 商品格 ---------- */
.grid {
  display: grid; gap: 30px 14px; padding: 0 var(--gutter);
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
}
@media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 10px; } }
.card {
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
}
.card:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 4px; border-radius: 10px; }
.thumb { position: relative; aspect-ratio: 1; background: var(--thumb-bg); border-radius: 10px; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; mix-blend-mode: var(--blend); }
.badge {
  position: absolute; left: 8px; top: 8px; background: var(--sale); color: #fff; font-size: 11px; font-weight: 700;
  letter-spacing: .02em; padding: 4px 8px; border-radius: 4px;
}
.acts { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
.act {
  width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--border-soft); cursor: pointer; padding: 0;
  background: var(--surface-1); color: var(--text-secondary); font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center; box-shadow: var(--pill-shadow);
}
:root[data-theme="dark"] .act { background: #1c1c1c; color: #ddd; }
.act:hover { color: var(--text-primary); }
.act.like[aria-pressed="true"] { color: var(--sale); border-color: var(--sale); }
.shop { font-size: 12px; color: var(--text-muted); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title {
  font-size: 14px; line-height: 1.38; font-weight: 500; min-height: 2.76em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.price-row { display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
.price { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.eff { font-size: 12px; color: var(--text-muted); }
.score-tag {
  font-size: 11px; font-weight: 600; color: var(--text-secondary); background: var(--surface-2);
  border-radius: 4px; padding: 1px 6px; font-variant-numeric: tabular-nums;
}
.spark { display: block; width: 100%; height: 28px; }
.spark-empty { font-size: 12px; color: var(--text-muted); height: 28px; display: flex; align-items: center; }
.meta { font-size: 12px; color: var(--text-muted); }
.empty { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 64px 16px; }
.req { margin: 0 0 40px; }
.req h3 { font-size: 18px; font-weight: 600; margin: 0 var(--gutter) 2px; }
.req .sub { margin: 0 var(--gutter) 14px; color: var(--text-muted); font-size: 13px; }
.req-help {
  background: var(--surface-2); border-radius: 12px; padding: 14px 16px; font-size: 14px;
  color: var(--text-secondary); margin: 0 var(--gutter) 28px;
}

/* ---------- 底部浮動分頁列 ---------- */
.tabbar {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: max(12px, env(safe-area-inset-bottom)); width: min(440px, calc(100vw - 24px));
  display: flex; padding: 6px; border-radius: 999px; background: var(--tabbar-bg);
  -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  border: 1px solid var(--border-soft); box-shadow: 0 8px 30px rgba(0,0,0,.16);
}
.tab {
  flex: 1; border: 0; background: none; font-size: 12px; font-weight: 600; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 8px; border-radius: 999px;
}
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { background: var(--tab-active); }

.fbbar {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 19;
  bottom: calc(max(12px, env(safe-area-inset-bottom)) + 86px);
  width: min(440px, calc(100vw - 24px)); background: var(--text-primary); color: var(--bg);
  border-radius: 999px; padding: 8px 8px 8px 20px; display: flex; gap: 8px; align-items: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 14px;
}
.fbbar .grow { flex: 1; }
.fbbar button { font-size: 14px; border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 0; font-weight: 600; }
.fbbar .send { background: var(--sale); color: #fff; }
.fbbar .clear { background: transparent; color: inherit; opacity: .75; }

/* ---------- 視窗 ---------- */
dialog {
  width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px);
  border: 0; border-radius: 20px; padding: 0; background: var(--surface-1); color: var(--text-primary);
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}
dialog::backdrop { background: rgba(0,0,0,.5); }
.dlg { padding: 22px; display: grid; gap: 18px; }
.dlg h2 { font-size: 18px; margin: 0 0 6px; line-height: 1.4; font-weight: 600; padding-right: 28px; }
.dlg-head { display: grid; grid-template-columns: 150px 1fr; gap: 18px; }
.dlg-head img { width: 150px; height: 150px; object-fit: contain; background: #fff; border-radius: 10px; }
.dlg .sub { font-size: 13px; color: var(--text-muted); }
.jp { font-size: 13px; color: var(--text-secondary); }
.links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.links a {
  color: var(--on-accent); background: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600;
  border-radius: 999px; padding: 9px 18px;
}
.links a.ghost { background: var(--surface-2); color: var(--text-primary); }
.close {
  position: absolute; right: 12px; top: 10px; border: 0; background: none; font-size: 26px;
  color: var(--text-muted); cursor: pointer; line-height: 1; width: 36px; height: 36px;
}
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; }
.stat .l { font-size: 12px; color: var(--text-muted); }
.about { font-size: 14px; color: var(--text-secondary); display: grid; gap: 10px; }
.about a { color: var(--text-primary); }
.chart-box { position: relative; }
.chart-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.chart-title button { white-space: nowrap; font-size: 12px; background: none; border: 0; text-decoration: underline; cursor: pointer; }
.chart svg { display: block; width: 100%; }
.tip {
  position: absolute; pointer-events: none; background: var(--text-primary); color: var(--bg);
  font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%);
  display: none; font-variant-numeric: tabular-nums;
}
table.hist { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.hist th, table.hist td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
table.hist th:first-child, table.hist td:first-child { text-align: left; }
.hist-wrap { max-height: 220px; overflow: auto; }
@media (max-width: 560px) {
  .dlg-head { grid-template-columns: 100px 1fr; }
  .dlg-head img { width: 100px; height: 100px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .btext, .seg { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <button class="pill icon" id="themeBtn" type="button" aria-label="切換深淺色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
  </button>
  <div class="logo" aria-label="日本好物追蹤">JPGOODS</div>
  <button class="pill icon r" id="infoBtn" type="button" aria-label="關於這個頁面">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>
  </button>
</header>

<div class="page">
  <nav class="cats" id="cats" aria-label="分類"></nav>

  <section id="sec-banner">
    <div class="banner" role="region" aria-label="公告">
      <button class="arr" id="bprev" type="button" aria-label="上一則"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="btext" id="btext" aria-live="polite">載入中…</div>
      <button class="arr" id="bnext" type="button" aria-label="下一則"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </section>

  <section id="sec-hero" hidden>
    <div class="hero-scroll" id="hero"></div>
    <div class="prog" id="prog" aria-hidden="true"></div>
  </section>

  <div class="searchbar" id="searchbar" hidden>
    <input type="search" id="q" placeholder="搜尋商品名、品牌、店家" aria-label="搜尋">
  </div>

  <h2 class="sec" id="title">今天想看什麼？</h2>
  <div class="sq" id="sorts" role="toolbar" aria-label="排序與篩選"></div>
  <div class="count" id="count"></div>
  <main id="grid" class="grid"></main>
</div>

<div class="fbbar" id="fbbar" role="region" aria-label="回饋" hidden>
  <span class="grow" id="fbtext"></span>
  <button class="clear" type="button" id="fbclear">清除</button>
  <button class="send" type="button" id="fbsend">送出回饋</button>
</div>

<nav class="tabbar" id="tabbar" aria-label="主選單"></nav>

<dialog id="dlg" aria-label="詳細資料"></dialog>

<script>
const $ = (s) => document.querySelector(s);
const yen = (n) => n == null ? "—" : "¥" + Number(n).toLocaleString("ja-JP");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SVGNS = "http://www.w3.org/2000/svg";

// ---------- 主題切換（記在 localStorage，失敗也不影響）----------
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
try { applyTheme(localStorage.getItem("jpgf-theme")); } catch (e) {}
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("jpgf-theme", next); } catch (e) {}
});

let DATA = null;
const state = { tab: "home", cat: "all", dealOnly: false, sort: "score", q: "" };
const SORTS = [["score", "推薦分數高"], ["deal", "特價優先"], ["new", "最新發現"], ["drop", "跌最多"],
               ["reviews", "評價數多"], ["price_asc", "價格低→高"], ["price_desc", "價格高→低"]];
const TABS = [["home", "主頁", "home"], ["search", "搜尋", "search"], ["likes", "收藏", "heart"], ["requests", "需求", "chat"]];
const TITLES = { home: "今天想看什麼？", search: "搜尋", likes: "我的收藏", requests: "我的需求" };

function icon(name, on) {
  const f = on ? "currentColor" : "none";
  const a = 'viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"';
  return {
    home: `<svg ${a} fill="${f}"><path d="M12 3 2.8 11v10h6.4v-6h5.6v6h6.4V11z"/></svg>`,
    search: `<svg ${a} fill="none" stroke-width="${on ? 2.8 : 2}"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>`,
    heart: `<svg ${a} fill="${f}"><path d="M12 20.5s-7.5-4.6-9.4-9.2C1.2 7.9 3.3 4.5 6.7 4.5c2 0 3.6 1.1 5.3 3 1.7-1.9 3.3-3 5.3-3 3.4 0 5.5 3.4 4.1 6.8C19.5 15.9 12 20.5 12 20.5z"/></svg>`,
    chat: `<svg ${a} fill="${f}"><path d="M4 5h16v11H9.5L4 20.5z"/></svg>`,
  }[name];
}

// ---------- ✕／♡ 回饋：先存在這台裝置，按「送出回饋」時開 GitHub Issue 交給後台處理 ----------
let pending = {};
try { pending = JSON.parse(localStorage.getItem("jpgf-pending") || "{}"); } catch (e) { pending = {}; }
function savePending() { try { localStorage.setItem("jpgf-pending", JSON.stringify(pending)); } catch (e) {} }
function byId(id) { return DATA.items.find((x) => x.id === id) || DATA.request_items.find((x) => x.id === id); }
function actionOf(it) { return pending[it.id] || it.feedback || null; }
function setAction(id, act) {
  const it = byId(id);
  if (!it) return;
  if (actionOf(it) === act) { delete pending[id]; } else { pending[id] = act; }
  savePending(); render(); renderBar();
}
function prunePending() {
  // 後台已處理完（✕ 的商品從資料消失、或 feedback 已一致）就清掉
  for (const [id, act] of Object.entries(pending)) {
    const it = byId(id);
    if (!it || it.feedback === act) delete pending[id];
  }
  savePending();
}
function renderBar() {
  const vals = Object.values(pending);
  const skip = vals.filter((a) => a === "skip").length, like = vals.length - skip;
  $("#fbbar").hidden = !vals.length;
  $("#fbtext").textContent = `待送出：✕ ${skip} 件・♡ ${like} 件`;
}
function sendFeedback() {
  const lines = Object.entries(pending).map(([id, act]) => {
    const it = byId(id);
    return `${act}:${id} ${it ? titleOf(it).slice(0, 40) : ""}`;
  });
  if (!lines.length || !DATA.repo) return;
  const title = `[回饋] ${lines.length} 件`;
  const body = "Dashboard 回饋（請直接按下方 Submit new issue 送出）\n\n" + lines.join("\n");
  const url = `https://github.com/${DATA.repo}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
  window.open(url, "_blank", "noopener");
}

function translateUrl(text) {
  return "https://translate.google.com/?sl=ja&tl=zh-TW&op=translate&text=" + encodeURIComponent(text);
}
function titleOf(it) { return it.zh_title || it.name; }
function dealLabel(d) { return (d.kind === "90d" ? "▼ 90 日新低 " : "▼ 30 日新低 ") + "−" + d.drop_pct + "%"; }

// ---------- 迷你走勢圖 ----------
function sparkline(series) {
  if (!series || series.length < 2) {
    return `<div class="spark-empty">${series && series.length ? "已記錄 1 天，明天起顯示走勢" : "尚無價格紀錄"}</div>`;
  }
  const W = 200, H = 28, P = 4;
  const ys = series.map((s) => s[1]);
  const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const x = (i) => P + (i * (W - 2 * P)) / (series.length - 1);
  const y = (v) => hi === lo ? H / 2 : P + ((hi - v) * (H - 2 * P)) / span;
  const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s[1]).toFixed(1)}`).join(" ");
  const last = series.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="近 ${series.length} 天實付價，最低 ${yen(lo)}，最高 ${yen(hi)}">
    <polyline points="${pts}" fill="none" stroke="var(--text-primary)" stroke-width="1.5"
      vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last)}" cy="${y(ys[last])}" r="3" fill="var(--text-primary)" stroke="var(--bg)" stroke-width="2"
      vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// ---------- 排序與篩選 ----------
const dropFromHigh = (it) => it.high ? (it.high - it.effective) / it.high : 0;
const CMP = {
  score: (a, b) => (b.score || 0) - (a.score || 0) || (!!b.deal - !!a.deal) || b.reviews - a.reviews,
  deal: (a, b) => (!!b.deal - !!a.deal) || ((b.deal?.drop_pct || 0) - (a.deal?.drop_pct || 0))
                  || (b.score || 0) - (a.score || 0) || b.reviews - a.reviews,
  new: (a, b) => (b.first_seen || "").localeCompare(a.first_seen || "") || b.reviews - a.reviews,
  drop: (a, b) => dropFromHigh(b) - dropFromHigh(a),
  reviews: (a, b) => b.reviews - a.reviews,
  price_asc: (a, b) => a.effective - b.effective,
  price_desc: (a, b) => b.effective - a.effective,
};
function baseList() {
  if (state.tab !== "likes") return DATA.items;
  const seen = new Set();
  return [...DATA.items, ...DATA.request_items].filter((it) => !seen.has(it.id) && seen.add(it.id) && actionOf(it) === "like");
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  const catOn = state.tab !== "likes" && state.cat !== "all";
  return baseList().filter((it) =>
    pending[it.id] !== "skip" &&
    (!catOn || it.category === state.cat) &&
    (!state.dealOnly || it.deal) &&
    (!q || (it.name + " " + (it.zh_title || "") + " " + it.shop).toLowerCase().includes(q))
  ).sort(CMP[state.sort]);
}

// ---------- 商品卡 ----------
function card(it, extra) {
  const act = actionOf(it);
  const score = extra?.score ?? it.score;
  return `
    <div class="card" role="button" tabindex="0" data-id="${it.id}" aria-label="${esc(titleOf(it))}">
      <div class="thumb">
        ${it.image ? `<img loading="lazy" src="${esc(it.image)}" alt="">` : ""}
        ${it.deal ? `<span class="badge">${dealLabel(it.deal)}</span>` : ""}
        <div class="acts">
          <button class="act skip" type="button" data-act="skip" aria-label="不要這類商品" title="不要這類商品">✕</button>
          <button class="act like" type="button" data-act="like" aria-pressed="${act === "like"}" aria-label="喜歡" title="喜歡">${act === "like" ? "♥" : "♡"}</button>
        </div>
      </div>
      <div class="shop">${esc(it.shop)}</div>
      <div class="title" lang="${it.zh_title ? "zh-Hant" : "ja"}">${esc(titleOf(it))}</div>
      <div class="price-row">
        <span class="price">${yen(it.effective)}</span>
        ${score != null ? `<span class="score-tag">${score} 分</span>` : ""}
        ${it.point_rate > 1 ? `<span class="eff">點數 ${it.point_rate} 倍</span>` : ""}
        ${!it.postage_included ? `<span class="eff">運費另計</span>` : ""}
      </div>
      ${sparkline(it.series)}
      <div class="meta">${it.reviews ? `★${it.rating}（${it.reviews}）` : "尚無評價"}</div>
    </div>`;
}

// ---------- 大圖輪播（推薦分數最高的幾件）----------
let heroKey = "";
function renderHero() {
  const show = state.tab === "home" && state.cat === "all" && !state.q && !state.dealOnly;
  const list = show
    ? DATA.items.filter((it) => pending[it.id] !== "skip" && it.image).sort(CMP.score).slice(0, 6) : [];
  $("#sec-hero").hidden = !list.length;
  const key = list.map((i) => i.id).join(",");
  if (key === heroKey) return;
  heroKey = key;
  $("#hero").innerHTML = list.map((it) => `
    <div class="hero" role="button" tabindex="0" data-id="${it.id}" aria-label="${esc(titleOf(it))}">
      <img src="${esc(it.image)}" alt="">
      ${it.deal ? `<span class="badge">${dealLabel(it.deal)}</span>` : ""}
      <div class="txt"><h3 lang="${it.zh_title ? "zh-Hant" : "ja"}">${esc(titleOf(it))}</h3>
        <div class="cta">${yen(it.effective)}　查看商品 →</div></div>
    </div>`).join("");
  $("#prog").innerHTML = list.map((_, i) => `<span class="seg${i === 0 ? " on" : ""}"></span>`).join("");
  $("#hero").scrollLeft = 0;
}

// ---------- 需求分頁 ----------
function renderRequests() {
  const reqs = DATA.requests || [];
  $("#count").textContent = `最近 ${reqs.length} 筆需求`;
  const g = $("#grid");
  g.className = "";
  const help = `<div class="req-help">在 Telegram 直接傳文字給 Bot，例如「想找包浩斯風的桌燈，2 萬円以內」，
    下一次整理時會幫你找，結果會推到 Telegram，也會出現在這裡。</div>`;
  if (!reqs.length) { g.innerHTML = help + `<div class="empty">還沒有需求</div>`; return; }
  g.innerHTML = help + reqs.map((r) => {
    const cards = r.results.map((x) => byId(x.id)).filter((it) => it && pending[it.id] !== "skip")
      .map((it) => card(it, r.results.find((x) => x.id === it.id))).join("");
    const status = r.status === "pending" ? "等待處理中…" :
      `${r.summary_zh ? esc(r.summary_zh) + "・" : ""}搜尋：${esc((r.keywords || []).join("／"))}`;
    return `<section class="req"><h3>🔎 ${esc(r.text)}</h3>
      <div class="sub">${esc((r.at || "").slice(0, 10))}・${status}</div>
      ${cards ? `<div class="grid">${cards}</div>` : (r.status === "pending" ? "" : `<div class="empty">沒有找到合適的商品</div>`)}
    </section>`;
  }).join("");
}

// ---------- 主畫面 ----------
function renderTabbar() {
  $("#tabbar").innerHTML = TABS.map(([k, label, ic]) =>
    `<button class="tab" type="button" data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ""}>${icon(ic, state.tab === k)}<span>${label}</span></button>`).join("");
}
function render() {
  const t = state.tab;
  $("#sec-banner").hidden = t !== "home";
  $("#cats").hidden = !(t === "home" || t === "search");
  $("#sorts").hidden = t === "requests";
  $("#searchbar").hidden = t !== "search";
  $("#title").textContent = TITLES[t];
  document.querySelectorAll("#cats .pill").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cat === state.cat));
  document.querySelectorAll("#sorts button").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.sort ? b.dataset.sort === state.sort : state.dealOnly);
  });
  renderHero();
  renderTabbar();
  if (t === "requests") return renderRequests();
  const g = $("#grid");
  g.className = "grid";
  if (t === "search" && !state.q.trim()) {
    $("#count").textContent = "";
    g.innerHTML = `<div class="empty">輸入商品名、品牌或店家來搜尋</div>`;
    return;
  }
  const list = filtered();
  $("#count").textContent = t === "likes" ? `${list.length} 件收藏` : `顯示 ${list.length} / ${DATA.items.length} 件`;
  g.innerHTML = list.length ? list.map((it) => card(it)).join("")
    : `<div class="empty">${t === "likes" ? "還沒有收藏。點商品右下角的 ♡ 就會出現在這裡" : "沒有符合條件的商品"}</div>`;
}
function setTab(t) {
  state.tab = t;
  if (t !== "search") { state.q = ""; $("#q").value = ""; }
  render();
  window.scrollTo({ top: 0 });
  if (t === "search") $("#q").focus();
}

// ---------- 公告列（自動輪播，可手動切換）----------
let bMsgs = [], bIdx = 0, bTimer = null;
function setBanner(i) {
  if (!bMsgs.length) return;
  bIdx = (i + bMsgs.length) % bMsgs.length;
  const el = $("#btext");
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = bMsgs[bIdx]; el.style.opacity = 1; }, 180);
}
function startBanner() {
  clearInterval(bTimer);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  bTimer = setInterval(() => setBanner(bIdx + 1), 6000);
}
function buildBanner() {
  const deals = DATA.items.filter((i) => i.deal).length;
  const need = DATA.deal_rules.min_history_days_30;
  bMsgs = [
    deals ? `▼ 今日真特價 ${deals} 件` : `真特價需累積 ${need} 天價格紀錄才會開始標示（目前 ${DATA.days_recorded} 天）`,
    `追蹤中 ${DATA.items.length} 件商品・資料日期 ${DATA.today}`,
    "實付價 = 售價 − 樂天點數回饋",
  ];
  $("#btext").textContent = bMsgs[0];
  startBanner();
}

// ---------- 視窗：商品詳細（價格走勢含游標提示＋表格）----------
function lineChart(box, series) {
  const W = Math.max(box.clientWidth, 280), H = 200, L = 64, R = 14, T = 14, B = 26;
  const ys = series.map((s) => s[1]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = (hi - lo) * 0.15 || hi * 0.05 || 1; lo -= pad; hi += pad;
  const x = (i) => series.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (series.length - 1);
  const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `實付價走勢，${series[0][0]} 至 ${series[series.length - 1][0]}`);
  let g = "";
  for (let k = 0; k <= 3; k++) {
    const v = lo + ((hi - lo) * k) / 3, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${yen(Math.round(v))}</text>`;
  }
  g += `<text x="${L}" y="${H - 6}" font-size="11" fill="var(--text-muted)">${series[0][0].slice(5)}</text>`;
  if (series.length > 1) g += `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--text-muted)">${series[series.length - 1][0].slice(5)}</text>`;
  const pts = series.map((s, i) => `${x(i)},${y(s[1])}`).join(" ");
  g += `<polyline points="${pts}" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  g += `<line id="xh" y1="${T}" y2="${H - B}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += `<circle id="xd" r="4.5" fill="var(--text-primary)" stroke="var(--surface-1)" stroke-width="2" visibility="${series.length === 1 ? "visible" : "hidden"}" cx="${x(0)}" cy="${y(ys[0])}"/>`;
  g += `<rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;
  box.querySelector(".chart").replaceChildren(svg);

  const tip = box.querySelector(".tip"), xh = svg.querySelector("#xh"), xd = svg.querySelector("#xd");
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) * (W / r.width);
    const i = series.length === 1 ? 0 : Math.max(0, Math.min(series.length - 1, Math.round(((px - L) / (W - L - R)) * (series.length - 1))));
    const cx = x(i), cy = y(series[i][1]);
    xh.setAttribute("x1", cx); xh.setAttribute("x2", cx); xh.setAttribute("visibility", "visible");
    xd.setAttribute("cx", cx); xd.setAttribute("cy", cy); xd.setAttribute("visibility", "visible");
    tip.style.display = "block";
    tip.style.left = (cx * r.width) / W + "px";
    tip.style.top = (cy * r.height) / H + "px";
    tip.textContent = `${series[i][0]}　${yen(series[i][1])}`;
  };
  const hide = () => { xh.setAttribute("visibility", "hidden"); tip.style.display = "none";
    if (series.length > 1) xd.setAttribute("visibility", "hidden"); };
  const hit = svg.querySelector("#hit");
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", hide); hit.addEventListener("touchend", hide);
}

          <h2 id="dlgTitle">${esc(titleOf(it))}</h2>

        <div class="stat"><div class="v">${yen(it.low)}</div><div class="l">紀錄最低</div></div>

        </div>

      <div class="sub">${esc(it.shop)}・首次發現 ${it.first_seen || "—"}${it.reviews ? `・★${it.rating}（${it.reviews} 則評價）` : ""}${it.rank ? `・排行榜第 ${it.rank} 名` : ""}</div>
    </div>`;
  d.querySelector(".close").addEventListener("click", () => d.close());
  d.querySelector("#tblBtn").addEventListener("click", (e) => {
    const w = d.querySelector(".hist-wrap"); w.hidden = !w.hidden;
    e.target.textContent = w.hidden ? "顯示表格" : "隱藏表格";

  d.showModal();
  const box = d.querySelector(".chart-box");
  if (it.series.length) lineChart(box, it.series);
  else box.querySelector(".chart").textContent = "尚無價格紀錄";

// ---------- 初始化 ----------
function setup() {
  const cats = [["all", "全部"], ...Object.entries(DATA.categories)];
  $("#cats").innerHTML = cats.map(([k, v]) =>
    `<button class="pill" type="button" data-cat="${k}" aria-pressed="false">${esc(v)}</button>`).join("");
  $("#cats").addEventListener("click", (e) => {
    const b = e.target.closest(".pill"); if (!b) return;
    state.cat = b.dataset.cat; render();
  });
  $("#sorts").innerHTML = `<button type="button" data-deal="1" aria-pressed="false">只看真特價</button>` +
    SORTS.map(([k, v]) => `<button type="button" data-sort="${k}" aria-pressed="false">${v}</button>`).join("");
  $("#sorts").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.sort) state.sort = b.dataset.sort; else state.dealOnly = !state.dealOnly;
    render();
  });
  $("#tabbar").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); });
  $("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("#infoBtn").addEventListener("click", openInfo);

  const open = (el) => { if (el) openDetail(el.dataset.id); };
  $("#grid").addEventListener("click", (e) => {
    const c = e.target.closest(".card");
    if (!c) return;
    const a = e.target.closest(".act");
    if (a) { e.stopPropagation(); setAction(c.dataset.id, a.dataset.act); return; }
    open(c);
  });
  $("#hero").addEventListener("click", (e) => open(e.target.closest(".hero")));
  document.addEventListener("keydown", (e) => {
    const t = e.target;
    if ((e.key !== "Enter" && e.key !== " ") || !t.classList) return;
    if (t.classList.contains("card") || t.classList.contains("hero")) { e.preventDefault(); open(t); }
  });
  let raf = 0;
  $("#hero").addEventListener("scroll", () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const first = $("#hero .hero"); if (!first) return;
      const i = Math.round($("#hero").scrollLeft / (first.offsetWidth + 12));
      document.querySelectorAll("#prog .seg").forEach((s, k) => s.classList.toggle("on", k <= i));
    });
  }, { passive: true });

  $("#bprev").addEventListener("click", () => { setBanner(bIdx - 1); startBanner(); });
  $("#bnext").addEventListener("click", () => { setBanner(bIdx + 1); startBanner(); });
  $("#fbsend").addEventListener("click", sendFeedback);
  $("#fbclear").addEventListener("click", () => { pending = {}; savePending(); render(); renderBar(); });
  $("#dlg").addEventListener("click", (e) => { if (e.target.id === "dlg") e.target.close(); });
}

fetch("data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => {
    DATA = d; DATA.request_items = DATA.request_items || []; DATA.requests = DATA.requests || [];
    prunePending(); buildBanner(); setup(); render(); renderBar();
  })
  .catch((e) => { $("#btext").textContent = "資料載入失敗：" + e.message; renderTabbar(); });
