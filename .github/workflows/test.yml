name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Mock end-to-end run
        run: python -m jpgf daily --mock --dry-run
      - name: Mock dashboard build
        run: python -m jpgf dashboard --mock --out out/site
