# jp-goods-finder 設定檔（不放任何密鑰；密鑰一律走環境變數／GitHub Secrets）

# 使用者口味描述：會原封不動放進 Claude 的評分提示詞
taste_profile: |
  喜歡：MEDICOM TOY（BE@RBRICK 等）這類設計師玩具；BEAMS JAPAN 這類有日本味的選物小物；
  北歐家居、燈具、海報；包浩斯（Bauhaus）風格、中世紀現代（Mid-Century Modern）、混搭風裝潢；
  服飾喜歡 XLARGE、LACOSTE 這類街頭／經典休閒品牌。
  偏好設計感強、日本才買得到或在台灣少見的東西。
  不喜歡：美容家電、廉價感的量產貨、純消耗品、食品、福袋、二手品。

# 分類與日文搜尋關鍵字（依使用者給的例子設定）。label 是 Dashboard／推播顯示的中文分類名。
categories:
  trend_goods:
    label: 潮流小物・玩具
    keywords:
      - メディコムトイ
      - ベアブリック 400％
      - ベアブリック 1000％
      - BEAMS JAPAN
      - ビームスジャパン 雑貨
  home_decor:
    label: 北歐・中世紀家居
    keywords:
      - 北欧 インテリア雑貨
      - ミッドセンチュリー 家具
      - ミッドセンチュリー インテリア
      - バウハウス インテリア
  lighting_art:
    label: 燈具・海報
    keywords:
      - 北欧 ペンダントライト
      - ミッドセンチュリー 照明
      - デザイナーズ テーブルランプ
      - バウハウス ポスター
      - 北欧 アートポスター
  gadgets:
    label: 新奇電子
    # 暫定：尚未拿到使用者的電子產品例子，先抓偏設計感的品項
    keywords:
      - デザイン家電 おしゃれ
      - Bluetoothスピーカー レトロ
      - デスクライト デザイナーズ
  fashion:
    label: 穿搭
    keywords:
      - XLARGE エクストララージ
      - エクストララージ Tシャツ
      - ラコステ ポロシャツ
      - ラコステ
# 分類排行榜（ranking_genre_ids）已停用：熱門榜會混進美容家電等不相關商品。
# 要恢復可在分類下加 ranking_genre_ids: [...]，並把 rakuten.use_ranking 設回 true。

rakuten:
  search_endpoint: https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701
  ranking_endpoint: https://openapi.rakuten.co.jp/ichibaranking/api/IchibaItem/Ranking/20220601
  hits_per_keyword: 30          # API 上限 30
  sort: standard                # standard / -reviewCount / +itemPrice ...
  min_price: 500                # 過濾太便宜的雜物（日圓）
  request_interval_sec: 1.2     # 樂天建議每秒 1 次以內
  use_ranking: false
  ng_keywords: 中古 USED 福袋 訳あり   # 標題含這些字的商品不要（空白分隔）

ai:
  model: claude-haiku-4-5-20251001
  batch_size: 20                # 一次送幾個商品給 Claude
  max_new_items_per_run: 80     # 每次最多替幾個「新商品」做翻譯＋評分（控制成本）
  feedback_examples: 15         # 提示詞裡最多帶幾筆喜歡／略過的例子

selection:
  daily_top_n: 5
  max_per_category: 2          # 每類最多幾個，避免全被同一類洗版
  min_score: 6                  # Claude 評分 1–10，低於此分不推
  resend_cooldown_days: 14      # 推過的商品幾天內不再推（除非變成真特價）
  min_review_count: 0           # 想只看有評價的商品可調高

deals:
  min_history_days_30: 7        # 至少要有幾天紀錄才判斷「30 日新低」
  min_history_days_90: 30       # 至少要有幾天紀錄才判斷「90 日新低」
  min_drop_pct: 3.0             # 比過去最低價再低多少 % 才算（避免 1 円抖動）
  bonus_30d: 2.0                # 排名加分
  bonus_90d: 3.0

notifiers:
  console: true                 # 印在 Actions log，永遠建議開著
  telegram: false               # 先關閉；決定要推播後改 true，並設定 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  # email: false                # 第 2 階段：週報
